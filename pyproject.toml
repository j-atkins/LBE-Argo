[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lbe-argo"
version = "0.1.0"
description = "LBE-Argo processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [] # pixi handles dependencies

[tool.pixi.pypi-dependencies]
# Allows editable local install if needed:
lbe-argo = { path = ".", editable = true }

[tool.mypy]
python_version = "3.11"
warn_return_any = true

[tool.ruff]
extend-exclude = [".pixi"]